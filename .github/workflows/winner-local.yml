name: Winner odds (home connection)

# Winner's site turns away data-centre servers, so this job runs on a self-hosted runner on an
# ordinary home connection in Israel. Every two hours it reads Winner's odds, re-prices every
# game, logs any new model picks and records closing prices, then publishes.
# If the machine is off, the job simply waits and the site keeps the last odds it had.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node and Git are installed on the machine once (winget), so nothing big downloads each run.
      - name: Check tools
        run: |
          node --version
          git --version
      - name: Fetch Winner odds
        timeout-minutes: 5
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.48.2
          node scripts/fetch-winner.mjs
      - name: Re-price and update the model picks
        run: node scripts/build-model.mjs
      - name: Publish
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/raw data/ledger public/data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "No changes"; exit 0 }
          git commit -m "Refresh Winner odds"
          git pull --rebase origin main
          git push
