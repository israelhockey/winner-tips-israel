name: Winner odds (home connection)

# Winner's site turns away data-centre servers, so this job runs on a self-hosted runner on an
# ordinary home connection in Israel. Every two hours it reads Winner's odds, re-prices every
# game, logs any new model picks and records closing prices, then publishes.
# If the machine is off, the job simply waits and the site keeps the last odds it had.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/winner-local.yml"
      - "scripts/fetch-winner.mjs"

concurrency:
  group: winner-odds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check tools
        run: |
          # A runner started before Git was installed doesn't have it on its PATH yet.
          foreach ($d in "C:\Program Files\Git\cmd", "C:\Program Files\nodejs") { if (Test-Path $d) { $d | Out-File -Append -Encoding utf8 $env:GITHUB_PATH; $env:PATH = "$d;$env:PATH" } }
          node --version
          git --version
      - uses: actions/checkout@v4
      - name: Fetch Winner odds
        timeout-minutes: 5
        run: node scripts/fetch-winner.mjs
      - name: Re-price and publish
        run: |
          $ErrorActionPreference = "Continue"  # git writes progress to stderr; judge by exit codes
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          # Other updates commit the same generated files, so always start from the latest version
          # online, put back the odds just fetched, re-price, and publish. Retry if someone beat us to it.
          Copy-Item data/raw/winner.json $env:RUNNER_TEMP/winner.json -ErrorAction SilentlyContinue
          Copy-Item data/raw/winner-status.json $env:RUNNER_TEMP/winner-status.json -ErrorAction SilentlyContinue
          for ($i = 1; $i -le 3; $i++) {
            git fetch origin main
            git reset --hard origin/main
            Copy-Item $env:RUNNER_TEMP/winner.json data/raw/winner.json -ErrorAction SilentlyContinue
            Copy-Item $env:RUNNER_TEMP/winner-status.json data/raw/winner-status.json -ErrorAction SilentlyContinue
            node scripts/build-model.mjs
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git add data/raw data/ledger public/data
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Output "No changes"; exit 0 }
            git commit -m "Refresh Winner odds"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "Push lost a race; trying again"
          }
          exit 1
