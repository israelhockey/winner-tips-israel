name: Refresh league data

# Pulls fixtures and results from the free sources, rebuilds the model and the picks ledger,
# and commits the result to public/data so the site always ships fresh numbers.
on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every round, not just open ones"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "content/picks.json"
      - ".github/workflows/data.yml"

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch fixtures and results
        # Saves each league as it goes; anything not finished in time is picked up next run.
        continue-on-error: true
        timeout-minutes: 40
        env:
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
        run: node scripts/fetch-data.mjs ${{ inputs.full && '--full' || '' }}
      - name: Fetch club logos
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/fetch-teams.mjs
      - name: Build model, tables and picks ledger
        if: always()
        run: node scripts/build-model.mjs
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          # Keep what this run fetched (fixtures, results, logos); everything else is rebuilt on top
          # of the latest version online, so concurrent updates (like the Winner odds job) never clash.
          mkdir -p "$RUNNER_TEMP/fetched"
          for f in data/raw/*.json; do
            case "$(basename "$f")" in winner.json|winner-status.json|winner-aliases.json) ;; *) cp "$f" "$RUNNER_TEMP/fetched/" ;; esac
          done
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP"/fetched/*.json data/raw/
            node scripts/build-model.mjs > /dev/null
            git add data/raw data/ledger public/data
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Refresh league data"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Lost a race with another update; rebuilding on the latest version"
          done
          exit 1
